name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'firebase-hosting'
  cancel-in-progress: true

jobs:
  deploy-firebase-hosting:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Check Firebase Secret
        id: check_secret
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_GAME_EC4FA }}
        run: |
          if [ -n "$FIREBASE_SECRET" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
            echo "Firebase secret found. Proceeding with deployment."
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "Firebase secret FIREBASE_SERVICE_ACCOUNT_MY_GAME_EC4FA is not configured. Skipping deployment."
          fi

      - name: Checkout repository
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: steps.check_secret.outputs.has_secret == 'true'
        run: flutter pub get

      - name: Build Flutter Web for Firebase Hosting
        if: steps.check_secret.outputs.has_secret == 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
        run: |
          flutter build web --release --base-href "/" \
            --dart-define=AI_PROXY_URL="${AI_PROXY_URL}" \
            --dart-define=FIREBASE_API_KEY="${FIREBASE_API_KEY}" \
            --dart-define=FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN || 'my-game-ec4fa.firebaseapp.com' }}" \
            --dart-define=FIREBASE_APP_ID_WEB="${{ secrets.FIREBASE_APP_ID_WEB || '1:419437402803:web:b473a96092ad7cd3e72ec6' }}" \
            --dart-define=FIREBASE_DATABASE_URL="${{ secrets.FIREBASE_DATABASE_URL || 'https://my-game-ec4fa-default-rtdb.asia-southeast1.firebasedatabase.app' }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID || 'my-game-ec4fa' }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '419437402803' }}"

      - name: Deploy to Firebase Hosting
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_GAME_EC4FA }}'
          channelId: live
          projectId: my-game-ec4fa
