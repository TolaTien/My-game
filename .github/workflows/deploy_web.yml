name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Flutter Web for GitHub Pages
        run: flutter build web --release --base-href "/My-game/"

      - name: Ensure SPA fallback (404.html)
        run: cp build/web/index.html build/web/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-firebase-hosting:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Check Firebase Secret
        id: check_secret
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_GAME_EC4FA }}
        run: |
          if [ -n "$FIREBASE_SECRET" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
            echo "Firebase secret found. Proceeding with deployment."
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "Firebase secret FIREBASE_SERVICE_ACCOUNT_MY_GAME_EC4FA is not configured. Skipping deployment."
          fi

      - name: Checkout repository
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: steps.check_secret.outputs.has_secret == 'true'
        run: flutter pub get

      - name: Build Flutter Web for Firebase Hosting
        if: steps.check_secret.outputs.has_secret == 'true'
        run: flutter build web --release --base-href "/"

      - name: Deploy to Firebase Hosting
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_GAME_EC4FA }}'
          channelId: live
          projectId: my-game-ec4fa
