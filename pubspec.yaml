name: my_game
description: "Big-War — 2D Pixel-Art Action RPG Mobile (Flutter + Flame Engine)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.38.2
  flame_audio: ^2.12.2
  shared_preferences: ^2.5.6
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_database: ^13.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/companions/
    - assets/images/heroes/
    - assets/images/heroes/george/
    - assets/images/heroes/ranger/
    - assets/images/heroes/tanker/
    - assets/images/heroes/ninja/
    - assets/images/heroes/valeria/
    - assets/images/heroes/garrick/
    - assets/images/heroes/nova/
    - assets/images/heroes/ember/
    - assets/images/heroes/kaelen/
    - assets/images/heroes/nova_blade/
    - assets/images/heroes/shadow/
    - assets/images/heroes/valenria/
    - assets/images/heroes/shadow/idle/
    - assets/images/heroes/shadow/run/
    - assets/images/heroes/shadow/attack/
    - assets/images/skills/
    - assets/images/ranks/
    - assets/images/maps/
    - assets/images/ui/
    - assets/audio/
