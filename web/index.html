<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Big-War — 2D Action RPG Mobile.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Dùng 'black' thay vì 'black-translucent' để tránh lỗi WebKit iOS PWA
       đẩy viewport lên và để hở dải đen ở đáy màn hình khi xoay ngang -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Big-War">
  <meta name="theme-color" content="#060A16">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Big-War</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060A16;
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Chặn iOS Safari / WebKit tự zoom & cuộn khung hình khi focus vào các ô input < 16px */
    input, textarea, select, .flt-text-editing, flt-text-editing-host input, flt-text-editing-host textarea {
      font-size: 16px !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      var BASE_VIEWPORT = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
      var RELAXED_VIEWPORT = 'width=device-width, initial-scale=1.0, viewport-fit=cover';
      var resetTimer = null;
      var isResetting = false;

      function ensureShadowInputCss(root) {
        if (!root) return;
        try {
          if (root.querySelector && !root.querySelector('#ios-input-zoom-guard')) {
            var style = document.createElement('style');
            style.id = 'ios-input-zoom-guard';
            style.textContent = 'input, textarea, select, .flt-text-editing { font-size: 16px !important; }';
            root.appendChild(style);
          }
        } catch (_) {}
      }

      function enforceAllInputs16px() {
        document.querySelectorAll('input, textarea, select, .flt-text-editing').forEach(function (el) {
          el.style.setProperty('font-size', '16px', 'important');
        });
        document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function (host) {
          if (host.shadowRoot) {
            ensureShadowInputCss(host.shadowRoot);
            host.shadowRoot.querySelectorAll('input, textarea, select, .flt-text-editing').forEach(function (el) {
              el.style.setProperty('font-size', '16px', 'important');
            });
          }
        });
      }

      function lockScrollOrigin() {
        if (window.scrollX !== 0 || window.scrollY !== 0) {
          window.scrollTo(0, 0);
        }
        if (document.documentElement) {
          document.documentElement.scrollTop = 0;
          document.documentElement.scrollLeft = 0;
        }
        if (document.body) {
          document.body.scrollTop = 0;
          document.body.scrollLeft = 0;
        }
      }

      function resetViewportScale(dispatchResize) {
        if (isResetting) return;
        isResetting = true;
        var meta = document.getElementById('viewport-meta') || document.querySelector('meta[name="viewport"]');
        if (meta) {
          // Ép WebKit iOS tính lại tỉ lệ 1:1 khi xoay ngang <-> dọc hoặc sau khi zoom bàn phím
          meta.setAttribute('content', RELAXED_VIEWPORT);
          requestAnimationFrame(function () {
            meta.setAttribute('content', BASE_VIEWPORT);
            lockScrollOrigin();
            if (dispatchResize) {
              window.dispatchEvent(new Event('resize'));
            }
            isResetting = false;
          });
        } else {
          lockScrollOrigin();
          if (dispatchResize) {
            window.dispatchEvent(new Event('resize'));
          }
          isResetting = false;
        }
      }

      function scheduleOrientationSync() {
        clearTimeout(resetTimer);
        lockScrollOrigin();
        resetViewportScale(true);
        resetTimer = setTimeout(function () {
          resetViewportScale(true);
        }, 280);
      }

      // Chống tự zoom & đẩy khung hình khi bấm vào bất kỳ form input nào trên iOS
      document.addEventListener('focusin', function (e) {
        enforceAllInputs16px();
        if (e.target && e.target.style) {
          e.target.style.setProperty('font-size', '16px', 'important');
        }
        setTimeout(lockScrollOrigin, 50);
        setTimeout(lockScrollOrigin, 200);
      }, true);

      document.addEventListener('focusout', function () {
        setTimeout(function () {
          resetViewportScale(true);
        }, 120);
      }, true);

      window.addEventListener('scroll', lockScrollOrigin, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('scroll', lockScrollOrigin);
        window.visualViewport.addEventListener('resize', function () {
          // Nếu không mở bàn phím mà vẫn bị kẹt scale > 1.02 (sau khi xoay hoặc blur) -> trả về 1.0
          var active = document.activeElement;
          var isEditing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
          if (!isEditing && window.visualViewport.scale > 1.02) {
            resetViewportScale(true);
          }
        });
      }

      window.addEventListener('orientationchange', scheduleOrientationSync);
      if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener) {
        window.screen.orientation.addEventListener('change', scheduleOrientationSync);
      }
      window.addEventListener('pageshow', function () {
        setTimeout(function () {
          resetViewportScale(true);
        }, 100);
      });

      // Theo dõi DOM để gắn CSS 16px vào ShadowRoot của flutter-view ngay khi Flutter mount
      var observer = new MutationObserver(function () {
        enforceAllInputs16px();
      });
      if (document.body) {
        observer.observe(document.body, { childList: true, subtree: true });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
